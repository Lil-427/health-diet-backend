server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/health_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: ${DB_PASSWORD:}

  # Jackson 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  type-aliases-package: com.health.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # SQL 日志输出（仅在 dev 环境启用，生产部署时注释掉）
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除值（1 表示已删除）
      logic-delete-value: 1
      # 逻辑未删除值（0 表示未删除）
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:}
  # 过期时间：7 天（毫秒）
  expiration: 604800000

# 日志级别
logging:
  level:
    com.health: DEBUG
    org.springframework.security: DEBUG

# 文件上传
file:
  upload-path: ./uploads
  avatar-path: ./uploads/avatars

# DeepSeek API 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat
  url: https://api.deepseek.com/chat/completions
  max-tokens: 2000
  temperature: 0.7
